name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pharmacy management (linked list, stack, queue)
        run: |
          for f in pharmacy-management/*.cpp; do
            g++ -std=c++20 -Wall -o "/tmp/$(basename "$f" .cpp)" "$f"
          done

      - name: Restaurant system
        run: g++ -std=c++20 -Wall -o /tmp/restaurant restaurant-system/main.cpp

      - name: OOP exercises
        run: |
          g++ -std=c++20 -Wall -o /tmp/cars oop/cars/*.cpp
          g++ -std=c++20 -Wall -o /tmp/employees oop/employees/*.cpp
          g++ -std=c++20 -Wall -o /tmp/shapes oop/shapes/shape_main.cpp

      - name: Run the non-interactive demos
        run: |
          /tmp/restaurant
          /tmp/cars
          /tmp/shapes
